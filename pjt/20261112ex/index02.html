<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
</head>
<body>
    
    <!-- form(양식)관련 태그 -->

    <form action="서버URI" method="post" name="signupform">
        
        ID: <input type="text" name="memId" placeholder="Input ID"> 
        <br>
        PW: <input type="password" name="memPw" placeholder="Input PW"> 
        <br>
        MAIL: <input type="text" name="memMail" placeholder="Input Mail"> 
        <br>
        PHONE: <input type="text" name="memPhone" placeholder="Input PhoneNumber"> 
        <br>
        HOBBY: 
            축구<input type="checkbox" name="memHobby" value="soccer">, &nbsp;&nbsp;
            야구<input type="checkbox" name="memHobby" value="baseball">, &nbsp;&nbsp;
            배구<input type="checkbox" name="memHobby" value="valleyball">, &nbsp;&nbsp;
            농구<input type="checkbox" name="memHobby" value="basketball">, &nbsp;&nbsp;
            탁구<input type="checkbox" name="memHobby" value="football"> 
            <br>
        GENDER:
            남성<input type="radio" name="memGender" value="M">, &nbsp;&nbsp;
            여성<input type="radio" name="memGender" value="W">, &nbsp;&nbsp;
            중성<input type="radio" name="memGender" value="MW">, &nbsp;&nbsp; 
            <br>
        국가:
            <select name="memCountry">
                <option value="KR">대한민국</option>
                <option value="USA">미국</option>
                <option value="JP">일본</option>
                <option value="Ch">중국</option>
                <option value="UK">영국</option>
            </select>
            <br>
        기타:
            <textarea name="memEtc"></textarea>
            <br>
        <input type="submit" value="SIGNUP">
        <input type="reset" value="RESET ">
        <br>
        <input type="button" value="BUTTON">

    </form>

</body>
</html>
