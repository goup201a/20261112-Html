<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <!-- 목록 태그들 -->
    <!-- <ul>, <ol>, <dl> -->

    <!-- <ul> (unorder list) (숫자순서 없이 -으로 나열)-->
    <ul>
        <li>짜장면</li>
        <li>짬뽕</li>
        <li>탕수육</li>
        <li>양장피</li>
    </ul>

    <!-- <ol> (order list) (1,2 처럼 숫자 순서 있음)-->
    <ol>
        <li>불고기</li>
        <li>비빔밥</li>
        <li>파전</li>
        <li>설렁탕</li>

    </ol>


    <!-- <dl> (desciption list) 나-->
    <dl>
        <dt>HTML</dt>
        <dd>웹문서를 구조화하는 마크업 언어</dd>

        <dt>CSS</dt>
        <dd>웹문서의 디자인을 담당하는 스타일 언어</dd>
    </dl>

</body>
</html>
